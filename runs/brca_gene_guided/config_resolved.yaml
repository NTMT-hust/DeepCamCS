data:
  data_dir: C:\Nguyen Tri\Paper\DêpCamCS\DeepCamCS_newCNN\data
  omics:
    mRNA: mRNA_filtered.csv
    Methylation: methylation_filtered.csv
    CNV: CNA_filtered.csv
  labels_file: labels.csv
  label_id_col: patient_id
  label_col: PAM50
splits:
  seeds:
  - 12
  - 3
  - 44
  - 63
  - 16
  - 1
  n_folds: 5
  val_fraction: 0.2
image:
  size: 240
  umap_n_neighbors: 30
  umap_min_dist: 0.1
  umap_metric: cosine
  umap_init: spectral
  clip_percentile:
  - 5
  - 95
model:
  arch: efficientnet_b1
  pretrained: true
  readout_levels:
  - 2
  - 3
  dropout: 0.6
train:
  epochs: 50
  swa_start_epoch: 30
  freeze_epochs: 3
  batch_size: 16
  eval_batch_size: 64
  lr: 0.01
  weight_decay: 0.001
  min_lr: 0.0
  momentum: 0.9
  nesterov: true
  warmup_epochs: 10
  warmup_start_factor: 0.05
  focal_gamma: 2.0
  deterministic: true
augment:
  enabled: true
  noise_std: 0.03
  p_noise: 0.2
  p_cutmix: 0.1
  p_mixup: 0.1
  p_smote: 0.1
  cutmix_ratio:
  - 0.2
  - 0.5
  mixup_alpha: 0.2
  smote_alpha_range:
  - 0.1
  - 0.4
guidance:
  enabled: true
  lambda_reg: 1000
  mask_build_epoch: 17
  mask_refresh_start: 20
  mask_refresh_every: 3
  loss_start_epoch: 18
  topk_ratio: 0.22
  frequency_threshold: 0.2
  protect_top_fraction: 0.5
  penalty_pair:
  - LumA
  - LumB
  penalty_samples: 4
attribution:
  ig_steps: 64
  max_batch: 72
  save_checkpoints: true
genes:
  top_k: 400
  label_by: predicted
pathway:
  gene_set: MSigDB_Hallmark_2020
  gmt_file: null
  omics:
  - mRNA
  padj: 0.05
  min_size: 5
go_kegg:
  omics:
  - mRNA
  signs:
  - positive
  ontology: BP
  padj: 0.05
  kegg: true
output_dir: runs/brca_gene_guided
device: auto
